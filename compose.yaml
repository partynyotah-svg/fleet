services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayfleet}
      POSTGRES_USER: ${POSTGRES_USER:-relayfleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-relayfleet}
      DATABASE_USER: ${POSTGRES_USER:-relayfleet}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      SESSION_COOKIE_SECURE: "true"
      APP_ORIGIN: https://${FLEET_DOMAIN:?Set FLEET_DOMAIN in .env}
      INGEST_SERVICE_TOKEN: ${INGEST_SERVICE_TOKEN:?Set a random INGEST_SERVICE_TOKEN in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      VEHICLE_COMMAND_ADAPTER: disabled
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [private, edge]

  ingest:
    build:
      context: .
      dockerfile: telemetry/Dockerfile
    restart: unless-stopped
    environment:
      FLEET_INTERNAL_URL: http://app:8080/api/v1/internal/ingest
      INGEST_SERVICE_TOKEN: ${INGEST_SERVICE_TOKEN:?Set a random INGEST_SERVICE_TOKEN in .env}
      MAX_BODY_BYTES: 16384
    depends_on:
      app:
        condition: service_healthy
    networks: [private, edge]

  proxy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      FLEET_DOMAIN: ${FLEET_DOMAIN:?Set FLEET_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  private:
    internal: true
  edge: