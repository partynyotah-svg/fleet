server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: relay-fleet
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./relayfleet-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /
      timeout: 30m
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
relay:
  app-origin: ${APP_ORIGIN:https://localhost}
  ingest-token: ${INGEST_SERVICE_TOKEN:}
  admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  google-maps-key: ${GOOGLE_MAPS_API_KEY:}
  command-adapter: ${VEHICLE_COMMAND_ADAPTER:disabled}
  activation:
    username: ${AFRICASTALKING_USERNAME:}
    api-key: ${AFRICASTALKING_API_KEY:}
    fleet-domain: ${FLEET_DOMAIN:}
    server-port: ${SERVER_PORT:}
    tracker-password: ${TRACKER_COMMAND_PASSWORD:}